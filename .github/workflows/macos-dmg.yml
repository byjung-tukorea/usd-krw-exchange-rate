name: Build SubDash DMG

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    defaults:
      run:
        working-directory: SubDash
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Render screenshots
        run: |
          mkdir -p build/shots
          ./build/SubDash.app/Contents/MacOS/SubDash --snapshot "$PWD/build/shots" &
          pid=$!
          for i in $(seq 1 60); do
            [ -f build/shots/5-settings.png ] && break
            sleep 1
          done
          sleep 1; kill $pid 2>/dev/null || true
          ls -la build/shots

      - uses: actions/upload-artifact@v4
        with:
          name: SubDash-${{ env.VERSION }}
          path: SubDash/build/*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ env.VERSION }}
          path: SubDash/build/shots/*.png

      # 화면 점검용: 캡처 이미지를 ci-screenshots 브랜치에 덮어쓴다 (GITHUB_TOKEN 푸시는 워크플로를 다시 실행하지 않음)
      - name: Publish screenshots branch
        if: always() && !startsWith(github.ref, 'refs/tags/')
        working-directory: SubDash/build/shots
        run: |
          git init -q
          git checkout -q -b ci-screenshots
          git add *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SubDash/build/*.dmg
